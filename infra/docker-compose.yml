services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16.10-alpine
    environment:
      POSTGRES_DB: askmetric
      POSTGRES_USER: askmetric_owner
      POSTGRES_PASSWORD: askmetric_owner
    volumes:
      - ./postgres/init-roles.sql:/docker-entrypoint-initdb.d/init-roles.sql:ro
      - askmetric-postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askmetric_owner -d askmetric"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/askmetric-realm.json:/opt/keycloak/data/import/askmetric-realm.json:ro
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  namesrv:
    image: apache/rocketmq:5.3.3
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'boot success' /home/rocketmq/logs/rocketmqlogs/namesrv.log"]
      interval: 5s
      timeout: 3s
      retries: 20

  broker:
    image: apache/rocketmq:5.3.3
    depends_on:
      namesrv:
        condition: service_healthy
    environment:
      NAMESRV_ADDR: namesrv:9876
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.3/conf/broker.conf:ro
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.3/conf/broker.conf
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'boot success' /home/rocketmq/logs/rocketmqlogs/broker.log && sh mqadmin clusterList -n namesrv:9876 2>/dev/null | grep -q broker-a"]
      interval: 5s
      timeout: 10s
      retries: 30

  topic-init:
    image: apache/rocketmq:5.3.3
    depends_on:
      broker:
        condition: service_healthy
    environment:
      ROCKETMQ_REQUEST_TOPIC: ${ROCKETMQ_REQUEST_TOPIC:-askmetric-agent-run-request}
      ROCKETMQ_EVENT_TOPIC: ${ROCKETMQ_EVENT_TOPIC:-askmetric-agent-run-event}
    command: >-
      sh -c "until sh mqadmin updateTopic -n namesrv:9876 -t $$ROCKETMQ_REQUEST_TOPIC -c DefaultCluster >/dev/null 2>&1
      && sh mqadmin topicRoute -n namesrv:9876 -t $$ROCKETMQ_REQUEST_TOPIC >/dev/null 2>&1; do sleep 2; done;
      until sh mqadmin updateTopic -n namesrv:9876 -t $$ROCKETMQ_EVENT_TOPIC -c DefaultCluster >/dev/null 2>&1
      && sh mqadmin topicRoute -n namesrv:9876 -t $$ROCKETMQ_EVENT_TOPIC >/dev/null 2>&1; do sleep 2; done"

  proxy:
    image: apache/rocketmq:5.3.3
    depends_on:
      broker:
        condition: service_healthy
    environment:
      NAMESRV_ADDR: namesrv:9876
    command: sh mqproxy -n namesrv:9876
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'startup successfully' /home/rocketmq/logs/rocketmqlogs/proxy.log"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      proxy:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/askmetric
      DATABASE_USER: askmetric_app
      DATABASE_PASSWORD: askmetric_app
      FLYWAY_URL: jdbc:postgresql://postgres:5432/askmetric
      FLYWAY_USER: askmetric_owner
      FLYWAY_PASSWORD: askmetric_owner
      OIDC_ISSUER_URI: http://localhost:8082/realms/askmetric
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/askmetric/protocol/openid-connect/certs
      ROCKETMQ_ENABLED: "true"
      ROCKETMQ_ENDPOINTS: proxy:8081
      ROCKETMQ_REQUEST_TOPIC: ${ROCKETMQ_REQUEST_TOPIC:-askmetric-agent-run-request}
      ROCKETMQ_EVENT_TOPIC: ${ROCKETMQ_EVENT_TOPIC:-askmetric-agent-run-event}
    ports:
      - "8080:8080"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      server:
        condition: service_started
      keycloak:
        condition: service_healthy
    ports:
      - "5173:80"

  agent:
    build:
      context: ..
      dockerfile: apps/agent/Dockerfile
    depends_on:
      proxy:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    environment:
      ROCKETMQ_ENDPOINTS: proxy:8081
      ROCKETMQ_REQUEST_TOPIC: ${ROCKETMQ_REQUEST_TOPIC:-askmetric-agent-run-request}
      ROCKETMQ_EVENT_TOPIC: ${ROCKETMQ_EVENT_TOPIC:-askmetric-agent-run-event}

volumes:
  askmetric-postgres:
