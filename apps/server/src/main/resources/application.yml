server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: askmetric-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/askmetric}
    username: ${DATABASE_USER:askmetric_app}
    password: ${DATABASE_PASSWORD:askmetric_app}
  flyway:
    url: ${FLYWAY_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/askmetric}}
    user: ${FLYWAY_USER:askmetric_owner}
    password: ${FLYWAY_PASSWORD:askmetric_owner}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8082/realms/askmetric}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8082/realms/askmetric/protocol/openid-connect/certs}

askmetric:
  query:
    datasource:
      url: ${QUERY_DATABASE_URL:jdbc:postgresql://localhost:5433/askmetric_demo_warehouse}
      username: ${QUERY_DATABASE_USER:askmetric_demo}
      password: ${QUERY_DATABASE_PASSWORD:askmetric_demo}
  rocketmq:
    enabled: ${ROCKETMQ_ENABLED:false}
    endpoints: ${ROCKETMQ_ENDPOINTS:localhost:8081}
    request-topic: ${ROCKETMQ_REQUEST_TOPIC:askmetric-agent-run-request}
    event-topic: ${ROCKETMQ_EVENT_TOPIC:askmetric-agent-run-event}
    consumer-group: ${ROCKETMQ_CONSUMER_GROUP:askmetric-server-events}
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
