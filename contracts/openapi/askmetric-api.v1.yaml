openapi: 3.1.0
info:
  title: AskMetric API
  version: 1.0.0
paths:
  /api/v1/session:
    get:
      operationId: getWorkspaceSession
      summary: Return the authenticated user's Workspace Membership context
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Workspace-Id
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Authenticated Workspace Membership context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSession"
        "401":
          description: Authentication is required
        "403":
          description: The requested Workspace is not available to the current user
  /api/v1/queries:
    post:
      operationId: executeGovernedQuery
      summary: Execute a governed read-only query through the Java Query Gateway
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Query result constrained by the semantic catalog and row budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "400":
          description: Query violates the read-only or semantic catalog policy
        "403":
          description: The Workspace is not available to the current user
        "500":
          description: Query execution failed
  /api/v1/conversations:
    get:
      operationId: listConversations
      summary: List Conversation summaries in the current Workspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Conversation summaries ordered by most recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
        "403":
          description: The Workspace is not available to the current user
    post:
      operationId: createConversation
      summary: Create a Conversation in the current Workspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Created Conversation snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSnapshot"
        "400":
          description: Invalid title
        "403":
          description: The Workspace is not available to the current user
  /api/v1/conversations/{conversationId}:
    get:
      operationId: getConversation
      summary: Return the persisted Conversation snapshot
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation and its ordered Messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSnapshot"
        "403":
          description: The Conversation is not available in the current Workspace
  /api/v1/conversations/{conversationId}/messages:
    post:
      operationId: createMessage
      summary: Persist a user Message in a Conversation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "201":
          description: Persisted Message, routed Agent Run, and optional reply or Analysis Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageProcessed"
        "400":
          description: Invalid message content
        "403":
          description: The Conversation is not available in the current Workspace
        "409":
          description: The Idempotency-Key was already used with different message content
  /api/v1/conversations/{conversationId}/runs/{runId}/events:
    get:
      operationId: streamAgentRunEvents
      summary: Replay and stream ordered Agent Run events for a Conversation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: Ordered SSE events after Last-Event-ID; terminal events complete the stream.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/AgentRunEvent"
        "400":
          description: Invalid Last-Event-ID
        "403":
          description: The Conversation is not available in the current Workspace
        "404":
          description: The Agent Run is not in the Conversation
  /api/v1/conversations/{conversationId}/runs/{runId}/cancel:
    post:
      operationId: cancelAgentRun
      summary: Cancel an active analysis Agent Run and its Analysis Task
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelAgentRunRequest"
      responses:
        "200":
          description: Persisted cancellation event containing the cancelled stage and reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunEvent"
        "400":
          description: Invalid cancellation reason
        "403":
          description: The Conversation is not available in the current Workspace
        "404":
          description: The Agent Run is not in the Conversation
        "409":
          description: The Agent Run is already terminal or is not an analysis run
components:
  parameters:
    WorkspaceId:
      in: header
      name: X-Workspace-Id
      required: false
      schema:
        type: string
    ConversationId:
      in: path
      name: conversationId
      required: true
      schema:
        type: string
    RunId:
      in: path
      name: runId
      required: true
      schema:
        type: string
    LastEventId:
      in: header
      name: Last-Event-ID
      required: false
      description: Sequence of the last event displayed by the client. The stream replays only later events.
      schema:
        type: integer
        format: int64
        minimum: 0
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: Reuses the first response when the same message request is retried.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    WorkspaceSession:
      type: object
      required: [user, currentMembership, memberships]
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
        currentMembership:
          $ref: "#/components/schemas/WorkspaceMembership"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMembership"
    CurrentUser:
      type: object
      required: [id, username, displayName, email]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
    WorkspaceMembership:
      type: object
      required: [membershipId, workspaceId, workspaceName]
      properties:
        membershipId:
          type: string
        workspaceId:
          type: string
        workspaceName:
          type: string
    ConversationSummary:
      type: object
      required: [conversationId, title, messageCount, createdAt, updatedAt]
      properties:
        conversationId:
          type: string
        title:
          type: string
        messageCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConversationSnapshot:
      type: object
      required: [conversationId, workspaceId, title, createdAt, updatedAt, messages, agentRuns, analysisTasks, evidenceSnapshots]
      properties:
        conversationId:
          type: string
        workspaceId:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMessage"
        agentRuns:
          type: array
          items:
            $ref: "#/components/schemas/AgentRun"
        analysisTasks:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisTask"
        evidenceSnapshots:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceSnapshot"
    ConversationMessage:
      type: object
      required: [messageId, conversationId, author, sequence, content, createdAt]
      properties:
        messageId:
          type: string
        conversationId:
          type: string
        author:
          type: string
          enum: [user, assistant, system]
        authorSubject:
          type: [string, "null"]
        sequence:
          type: integer
          format: int64
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    MessageProcessed:
      type: object
      required: [userMessage, agentRun]
      properties:
        userMessage:
          $ref: "#/components/schemas/ConversationMessage"
        assistantMessage:
          $ref: "#/components/schemas/ConversationMessage"
        agentRun:
          $ref: "#/components/schemas/AgentRun"
        analysisTask:
          $ref: "#/components/schemas/AnalysisTask"
    AgentRun:
      type: object
      required: [runId, conversationId, inputMessageId, intentRoute, intentConfidence, createdAt, auditEvents]
      properties:
        runId:
          type: string
        conversationId:
          type: string
        inputMessageId:
          type: string
        intentRoute:
          type: string
          enum: [chat, analysis, task_control, approval]
        intentConfidence:
          type: number
          minimum: 0
          maximum: 1
        analysisTaskId:
          type: [string, "null"]
        metricDefinitionVersionId:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        auditEvents:
          type: array
          items:
            $ref: "#/components/schemas/AgentRunAuditEvent"
    AnalysisTask:
      type: object
      required: [analysisTaskId, conversationId, goal, status, sourceAgentRunId, createdAt]
      properties:
        analysisTaskId:
          type: string
        conversationId:
          type: string
        goal:
          type: string
        status:
          type: string
          enum: [active, waiting_for_input, waiting_for_approval, completed, failed, cancelled]
        sourceAgentRunId:
          type: string
        metricDefinitionVersionId:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    EvidenceSnapshot:
      type: object
      required: [evidenceSnapshotId, conversationId, analysisTaskId, runId, queryId, sourceTable, sourceRange, columns, rows, rowCount, durationMs, createdAt]
      properties:
        evidenceSnapshotId:
          type: string
        conversationId:
          type: string
        analysisTaskId:
          type: string
        runId:
          type: string
        queryId:
          type: string
        sourceTable:
          type: string
        sourceRange:
          type: string
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        rowCount:
          type: integer
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
    AgentRunAuditEvent:
      type: object
      required: [eventId, runId, sequence, eventType, occurredAt, message, source]
      properties:
        eventId:
          type: string
        runId:
          type: string
        sequence:
          type: integer
          format: int64
        eventType:
          type: string
          enum: [agent.run.accepted, agent.run.progress, agent.run.completed, agent.run.failed, agent.run.cancelled]
        occurredAt:
          type: string
          format: date-time
        message:
          type: string
        source:
          type: string
          enum: [java, python]
    AgentRunEvent:
      allOf:
        - $ref: "#/components/schemas/AgentRunAuditEvent"
        - type: object
          required: [schemaVersion, conversationId]
          properties:
            schemaVersion:
              type: integer
              enum: [1]
            conversationId:
              type: string
    CreateConversationRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    CreateMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
    CancelAgentRunRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    QueryRequest:
      type: object
      required: [sql]
      properties:
        workspaceId:
          type: string
          description: Overwritten by Java from the authenticated Workspace context.
        analysisTaskId:
          type: [string, "null"]
        runId:
          type: [string, "null"]
        sql:
          type: string
          minLength: 1
          maxLength: 20000
        parameters:
          type: array
          items: {}
    QueryResult:
      type: object
      required: [queryId, status, columns, rows, rowCount, durationMs]
      properties:
        queryId:
          type: string
        evidenceSnapshotId:
          type: [string, "null"]
        status:
          type: string
          enum: [SUCCEEDED, REJECTED, FAILED]
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        rowCount:
          type: integer
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 0
        reason:
          type: [string, "null"]
        sourceTable:
          type: [string, "null"]
        sourceRange:
          type: [string, "null"]
