openapi: 3.1.0
info:
  title: AskMetric API
  version: 1.0.0
paths:
  /api/v1/session:
    get:
      operationId: getWorkspaceSession
      summary: Return the authenticated user's Workspace Membership context
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Workspace-Id
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Authenticated Workspace Membership context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSession"
        "401":
          description: Authentication is required
        "403":
          description: The requested Workspace is not available to the current user
  /api/v1/conversations:
    get:
      operationId: listConversations
      summary: List Conversation summaries in the current Workspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Conversation summaries ordered by most recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
        "403":
          description: The Workspace is not available to the current user
    post:
      operationId: createConversation
      summary: Create a Conversation in the current Workspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Created Conversation snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSnapshot"
        "400":
          description: Invalid title
        "403":
          description: The Workspace is not available to the current user
  /api/v1/conversations/{conversationId}:
    get:
      operationId: getConversation
      summary: Return the persisted Conversation snapshot
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation and its ordered Messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSnapshot"
        "403":
          description: The Conversation is not available in the current Workspace
  /api/v1/conversations/{conversationId}/messages:
    post:
      operationId: createMessage
      summary: Persist a user Message in a Conversation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "201":
          description: Persisted user Message, deterministic assistant reply, and completed chat Agent Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessageCompleted"
        "400":
          description: Invalid message content
        "403":
          description: The Conversation is not available in the current Workspace
components:
  parameters:
    WorkspaceId:
      in: header
      name: X-Workspace-Id
      required: false
      schema:
        type: string
    ConversationId:
      in: path
      name: conversationId
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    WorkspaceSession:
      type: object
      required: [user, currentMembership, memberships]
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
        currentMembership:
          $ref: "#/components/schemas/WorkspaceMembership"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMembership"
    CurrentUser:
      type: object
      required: [id, username, displayName, email]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
    WorkspaceMembership:
      type: object
      required: [membershipId, workspaceId, workspaceName]
      properties:
        membershipId:
          type: string
        workspaceId:
          type: string
        workspaceName:
          type: string
    ConversationSummary:
      type: object
      required: [conversationId, title, messageCount, createdAt, updatedAt]
      properties:
        conversationId:
          type: string
        title:
          type: string
        messageCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConversationSnapshot:
      type: object
      required: [conversationId, workspaceId, title, createdAt, updatedAt, messages, agentRuns]
      properties:
        conversationId:
          type: string
        workspaceId:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMessage"
        agentRuns:
          type: array
          items:
            $ref: "#/components/schemas/AgentRun"
    ConversationMessage:
      type: object
      required: [messageId, conversationId, author, sequence, content, createdAt]
      properties:
        messageId:
          type: string
        conversationId:
          type: string
        author:
          type: string
          enum: [user, assistant, system]
        authorSubject:
          type: [string, "null"]
        sequence:
          type: integer
          format: int64
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    ChatMessageCompleted:
      type: object
      required: [userMessage, assistantMessage, agentRun]
      properties:
        userMessage:
          $ref: "#/components/schemas/ConversationMessage"
        assistantMessage:
          $ref: "#/components/schemas/ConversationMessage"
        agentRun:
          $ref: "#/components/schemas/AgentRun"
    AgentRun:
      type: object
      required: [runId, conversationId, inputMessageId, intentRoute, createdAt, auditEvents]
      properties:
        runId:
          type: string
        conversationId:
          type: string
        inputMessageId:
          type: string
        intentRoute:
          type: string
          enum: [chat, analysis, task_control, approval]
        createdAt:
          type: string
          format: date-time
        auditEvents:
          type: array
          items:
            $ref: "#/components/schemas/AgentRunAuditEvent"
    AgentRunAuditEvent:
      type: object
      required: [eventId, runId, sequence, eventType, occurredAt, message, source]
      properties:
        eventId:
          type: string
        runId:
          type: string
        sequence:
          type: integer
          format: int64
        eventType:
          type: string
          enum: [agent.run.accepted, agent.run.progress, agent.run.completed, agent.run.failed]
        occurredAt:
          type: string
          format: date-time
        message:
          type: string
        source:
          type: string
          enum: [java, python]
    CreateConversationRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    CreateMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
