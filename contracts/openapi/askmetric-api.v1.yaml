openapi: 3.1.0
info:
  title: AskMetric API
  version: 1.0.0
paths:
  /api/v1/session:
    get:
      operationId: getWorkspaceSession
      summary: Return the authenticated user's Workspace Membership context
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Workspace-Id
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Authenticated Workspace Membership context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSession"
        "401":
          description: Authentication is required
        "403":
          description: The requested Workspace is not available to the current user
  /api/v1/queries:
    post:
      operationId: executeGovernedQuery
      summary: Execute a governed read-only query through the Java Query Gateway
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Query result constrained by the semantic catalog and row budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "400":
          description: Query violates the read-only or semantic catalog policy
        "403":
          description: The Workspace is not available to the current user
        "500":
          description: Query execution failed
  /api/v1/agent-run-queries:
    post:
      operationId: executeGovernedQueryForAgentRun
      summary: Execute a governed query on behalf of an Agent Run using a Java-minted query grant
      description: Python Agent Runtime entry; identity comes from the short-lived HMAC query grant bound to the run, not an end-user JWT.
      parameters:
        - name: X-Query-Grant
          in: header
          required: true
          schema:
            type: string
          description: Query grant issued with the agent.run.requested message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentQueryRequest"
      responses:
        "200":
          description: Query result with an Evidence Snapshot reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "400":
          description: Missing fields or query violates the governance policy
        "401":
          description: Query grant is invalid or expired
        "404":
          description: Agent Run not found
  /api/v1/conversations/{conversationId}/summaries:
    post:
      operationId: createConversationSummary
      summary: Create a versioned summary over an explicit message range
      security:
        - bearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromSequence, toSequence]
              properties:
                fromSequence:
                  type: integer
                  format: int64
                  minimum: 1
                toSequence:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        "201":
          description: 摘要创建成功；原始 Message 不受影响
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSummary"
        "400":
          description: 范围无效或没有覆盖任何消息
  /api/v1/user-memories:
    post:
      operationId: proposeUserMemory
      summary: Register a pending user memory awaiting owner confirmation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "201":
          description: 待确认记忆已登记
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMemory"
        "400":
          description: 内容无效
    get:
      operationId: listUserMemories
      summary: List the owner's memories including pending ones
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: 记忆列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserMemory"
  /api/v1/user-memories/{userMemoryId}/confirmation:
    post:
      operationId: confirmUserMemory
      summary: Confirm a proposed memory as its owner
      security:
        - bearerAuth: []
      parameters:
        - name: userMemoryId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: 已确认，此后对 Agent 可见
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMemory"
        "400":
          description: 不是待确认状态或不存在
  /api/v1/user-memories/{userMemoryId}:
    delete:
      operationId: deleteUserMemory
      summary: Delete a memory as its owner
      security:
        - bearerAuth: []
      parameters:
        - name: userMemoryId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "204":
          description: 已删除，不再被使用
        "400":
          description: 不存在
  /api/v1/agent-run-memories:
    get:
      operationId: listUserMemoriesForAgentRun
      summary: Read confirmed memories for an Agent Run using a query grant
      description: Only CONFIRMED memories of the run author in the run's workspace are returned.
      parameters:
        - name: X-Query-Grant
          in: header
          required: true
          schema:
            type: string
        - name: runId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已确认记忆列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserMemory"
        "401":
          description: 查询授权无效或过期
        "404":
          description: Agent Run 不存在
  /api/v1/knowledge-sources:
    post:
      operationId: uploadKnowledgeSource
      summary: Upload a text-based knowledge source and ingest it
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 文本型 PDF、Markdown 或纯文本文件，最大 5MB。
                title:
                  type: string
                  maxLength: 200
      responses:
        "201":
          description: 摄取完成（失败时状态为 FAILED）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSource"
        "400":
          description: 参数或类型不支持
        "413":
          description: 上传内容超出大小限制
    get:
      operationId: listKnowledgeSources
      summary: List knowledge sources in the current Workspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: 来源列表（不含全文）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeSource"
  /api/v1/agent-run-knowledge:
    get:
      operationId: retrieveKnowledgeForAgentRun
      summary: Retrieve knowledge passages for an Agent Run using a Java-minted query grant
      description: Python Agent Runtime entry; results contain citation data only and never influence policies or tools.
      parameters:
        - name: X-Query-Grant
          in: header
          required: true
          schema:
            type: string
        - name: runId
          in: query
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 检索到的知识段落（最多 3 条）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeRetrievalItem"
        "400":
          description: 缺少参数
        "401":
          description: 查询授权无效或过期
        "404":
          description: Agent Run 不存在
  /api/v1/agent-run-proposals:
    post:
      operationId: submitActionProposalForAgentRun
      summary: Submit an Action Proposal draft derived from an Agent Run using a query grant
      description: Python Agent Runtime entry; exact parameters are snapshotted server-side from the run's bound custom metric definition. The draft must be confirmed by the initiator before it awaits approval; the Agent has no execution path. Per ADR-0009 the Agent may only submit PROMOTE_CUSTOM_CALIBER here.
      parameters:
        - name: X-Query-Grant
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runId, actionType]
              properties:
                runId:
                  type: string
                actionType:
                  type: string
                  enum: [PROMOTE_CUSTOM_CALIBER]
      responses:
        "201":
          description: 已创建（或重放）的操作提案草案
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionProposal"
        "400":
          description: 请求无效、操作类型不受支持或运行未绑定自定义口径
        "401":
          description: 查询授权无效或过期
        "404":
          description: Agent Run 不存在
  /api/v1/action-proposals/{actionProposalId}/confirmation:
    post:
      operationId: confirmActionProposal
      summary: Confirm the creation of a draft Action Proposal as its initiator
      description: Only the initiator can confirm; parameters and idempotency key stay immutable, the proposal then awaits approval (T23).
      security:
        - bearerAuth: []
      parameters:
        - name: actionProposalId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: 已确认，提案进入等待审批
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionProposal"
        "400":
          description: 提案不是待确认状态或当前成员不是发起者
  /api/v1/action-proposals/{actionProposalId}/discard:
    post:
      operationId: discardActionProposal
      summary: Discard a draft Action Proposal as its initiator
      description: A discarded proposal never produces side effects.
      security:
        - bearerAuth: []
      parameters:
        - name: actionProposalId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: 已放弃的提案
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionProposal"
        "400":
          description: 提案不是待确认状态或当前成员不是发起者
  /api/v1/conversations:
    get:
      operationId: listConversations
      summary: List Conversation summaries in the current Workspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Conversation summaries ordered by most recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationListItem"
        "403":
          description: The Workspace is not available to the current user
    post:
      operationId: createConversation
      summary: Create a Conversation in the current Workspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Created Conversation snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSnapshot"
        "400":
          description: Invalid title
        "403":
          description: The Workspace is not available to the current user
  /api/v1/conversations/{conversationId}:
    get:
      operationId: getConversation
      summary: Return the persisted Conversation snapshot
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation and its ordered Messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSnapshot"
        "403":
          description: The Conversation is not available in the current Workspace
  /api/v1/conversations/{conversationId}/messages:
    post:
      operationId: createMessage
      summary: Persist a user Message in a Conversation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageRequest"
      responses:
        "201":
          description: Persisted Message, routed Agent Run, and optional reply or Analysis Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageProcessed"
        "400":
          description: Invalid message content
        "403":
          description: The Conversation is not available in the current Workspace
        "409":
          description: The Idempotency-Key was already used with different message content
  /api/v1/conversations/{conversationId}/runs/{runId}/events:
    get:
      operationId: streamAgentRunEvents
      summary: Replay and stream ordered Agent Run events for a Conversation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: Ordered SSE events after Last-Event-ID; terminal events complete the stream.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/AgentRunEvent"
        "400":
          description: Invalid Last-Event-ID
        "403":
          description: The Conversation is not available in the current Workspace
        "404":
          description: The Agent Run is not in the Conversation
  /api/v1/conversations/{conversationId}/runs/{runId}/cancel:
    post:
      operationId: cancelAgentRun
      summary: Cancel an active analysis Agent Run and its Analysis Task
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkspaceId"
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelAgentRunRequest"
      responses:
        "200":
          description: Persisted cancellation event containing the cancelled stage and reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunEvent"
        "400":
          description: Invalid cancellation reason
        "403":
          description: The Conversation is not available in the current Workspace
        "404":
          description: The Agent Run is not in the Conversation
        "409":
          description: The Agent Run is already terminal or is not an analysis run
components:
  parameters:
    WorkspaceId:
      in: header
      name: X-Workspace-Id
      required: false
      schema:
        type: string
    ConversationId:
      in: path
      name: conversationId
      required: true
      schema:
        type: string
    RunId:
      in: path
      name: runId
      required: true
      schema:
        type: string
    LastEventId:
      in: header
      name: Last-Event-ID
      required: false
      description: Sequence of the last event displayed by the client. The stream replays only later events.
      schema:
        type: integer
        format: int64
        minimum: 0
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: Reuses the first response when the same message request is retried.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    WorkspaceSession:
      type: object
      required: [user, currentMembership, memberships]
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
        currentMembership:
          $ref: "#/components/schemas/WorkspaceMembership"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMembership"
    CurrentUser:
      type: object
      required: [id, username, displayName, email]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
    WorkspaceMembership:
      type: object
      required: [membershipId, workspaceId, workspaceName]
      properties:
        membershipId:
          type: string
        workspaceId:
          type: string
        workspaceName:
          type: string
    ConversationSummary:
      type: object
      required: [conversationSummaryId, conversationId, version, fromSequence, toSequence, summaryText, createdAt]
      properties:
        conversationSummaryId:
          type: string
        workspaceId:
          type: string
        conversationId:
          type: string
        version:
          type: integer
          minimum: 1
        fromSequence:
          type: integer
          format: int64
          minimum: 1
        toSequence:
          type: integer
          format: int64
          minimum: 1
        summaryText:
          type: string
        sourceAgentRunId:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    UserMemory:
      type: object
      required: [userMemoryId, workspaceId, userSubject, content, status, createdAt]
      properties:
        userMemoryId:
          type: string
        workspaceId:
          type: string
        userSubject:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [PROPOSED, CONFIRMED]
        sourceConversationId:
          type: [string, "null"]
        sourceAgentRunId:
          type: [string, "null"]
        confirmedAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
    ConversationListItem:
      type: object
      required: [conversationId, title, messageCount, createdAt, updatedAt]
      properties:
        conversationId:
          type: string
        title:
          type: string
        messageCount:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConversationSnapshot:
      type: object
      required: [conversationId, workspaceId, title, createdAt, updatedAt, messages, agentRuns, analysisTasks, evidenceSnapshots, analysisFindings, conversationSummaries, actionProposals]
      properties:
        conversationId:
          type: string
        workspaceId:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMessage"
        agentRuns:
          type: array
          items:
            $ref: "#/components/schemas/AgentRun"
        analysisTasks:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisTask"
        evidenceSnapshots:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceSnapshot"
        analysisFindings:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisFinding"
        conversationSummaries:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
        actionProposals:
          type: array
          items:
            $ref: "#/components/schemas/ActionProposal"
    ActionProposal:
      type: object
      required: [actionProposalId, workspaceId, conversationId, analysisTaskId, sourceAgentRunId, actionType, status, metricKey, versionLabel, calculationRule, timeBoundary, exclusions, policyVersion, idempotencyKey, proposedBy, createdAt]
      properties:
        actionProposalId:
          type: string
        workspaceId:
          type: string
        conversationId:
          type: string
        analysisTaskId:
          type: string
        sourceAgentRunId:
          type: string
        actionType:
          type: string
          enum: [PROMOTE_CUSTOM_CALIBER, REVISE_STANDARD_CALIBER]
        status:
          type: string
          enum: [AWAITING_CONFIRMATION, AWAITING_APPROVAL, SUPERSEDED, DISCARDED]
        metricKey:
          type: string
        versionLabel:
          type: string
        calculationRule:
          type: string
        timeBoundary:
          type: string
        exclusions:
          type: string
        policyVersion:
          type: integer
        idempotencyKey:
          type: string
        proposedBy:
          type: string
        confirmedAt:
          type: string
          format: date-time
        supersededBy:
          type: string
        createdAt:
          type: string
          format: date-time
    AnalysisFinding:
      type: object
      required: [findingId, conversationId, analysisTaskId, runId, metricDefinitionVersionId, verified, conclusion, evidenceSnapshotIds, assumptions, uncertainties, createdAt]
      properties:
        findingId:
          type: string
        conversationId:
          type: string
        analysisTaskId:
          type: string
        runId:
          type: string
        metricDefinitionVersionId:
          type: string
        verified:
          type: boolean
        conclusion:
          type: string
        evidenceSnapshotIds:
          type: array
          minItems: 1
          items:
            type: string
        assumptions:
          type: array
          items:
            type: string
        uncertainties:
          type: array
          items:
            type: string
        knowledgeCitations:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeCitation"
        createdAt:
          type: string
          format: date-time
    KnowledgeSource:
      type: object
      required: [knowledgeSourceId, workspaceId, title, filename, contentType, byteSize, status, passageCount, createdAt]
      properties:
        knowledgeSourceId:
          type: string
        workspaceId:
          type: string
        title:
          type: string
        filename:
          type: string
        contentType:
          type: string
          enum: [text/plain, text/markdown, application/pdf]
        byteSize:
          type: integer
          format: int64
        status:
          type: string
          enum: [UPLOADED, READY, FAILED]
        failureReason:
          type: [string, "null"]
        passageCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        ingestedAt:
          type: [string, "null"]
          format: date-time
    KnowledgeCitation:
      type: object
      required: [knowledgeSourceId, passageNumber, quote]
      properties:
        knowledgeSourceId:
          type: string
        passageNumber:
          type: integer
          minimum: 1
        quote:
          type: string
    KnowledgeRetrievalItem:
      type: object
      required: [knowledgeSourceId, title, passageNumber, quote]
      properties:
        knowledgeSourceId:
          type: string
        title:
          type: string
        passageNumber:
          type: integer
          minimum: 1
        quote:
          type: string
    ConversationMessage:
      type: object
      required: [messageId, conversationId, author, sequence, content, createdAt]
      properties:
        messageId:
          type: string
        conversationId:
          type: string
        author:
          type: string
          enum: [user, assistant, system]
        authorSubject:
          type: [string, "null"]
        sequence:
          type: integer
          format: int64
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    MessageProcessed:
      type: object
      required: [userMessage, agentRun]
      properties:
        userMessage:
          $ref: "#/components/schemas/ConversationMessage"
        assistantMessage:
          $ref: "#/components/schemas/ConversationMessage"
        agentRun:
          $ref: "#/components/schemas/AgentRun"
        analysisTask:
          $ref: "#/components/schemas/AnalysisTask"
    AgentRun:
      type: object
      required: [runId, conversationId, inputMessageId, intentRoute, intentConfidence, createdAt, auditEvents]
      properties:
        runId:
          type: string
        conversationId:
          type: string
        inputMessageId:
          type: string
        intentRoute:
          type: string
          enum: [chat, analysis, task_control, approval]
        intentConfidence:
          type: number
          minimum: 0
          maximum: 1
        analysisTaskId:
          type: [string, "null"]
        metricDefinitionVersionId:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        auditEvents:
          type: array
          items:
            $ref: "#/components/schemas/AgentRunAuditEvent"
    AnalysisTask:
      type: object
      required: [analysisTaskId, conversationId, goal, status, sourceAgentRunId, createdAt]
      properties:
        analysisTaskId:
          type: string
        conversationId:
          type: string
        goal:
          type: string
        status:
          type: string
          enum: [active, waiting_for_input, waiting_for_approval, completed, failed, cancelled]
        sourceAgentRunId:
          type: string
        metricDefinitionVersionId:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    EvidenceSnapshot:
      type: object
      required: [evidenceSnapshotId, conversationId, analysisTaskId, runId, queryId, sourceTable, sourceRange, columns, rows, rowCount, durationMs, createdAt]
      properties:
        evidenceSnapshotId:
          type: string
        conversationId:
          type: string
        analysisTaskId:
          type: string
        runId:
          type: string
        queryId:
          type: string
        sourceTable:
          type: string
        sourceRange:
          type: string
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        rowCount:
          type: integer
          minimum: 0
        durationMs:
          type: integer
          format: int64
          minimum: 0
        createdAt:
          type: string
          format: date-time
    AgentRunAuditEvent:
      type: object
      required: [eventId, runId, sequence, eventType, occurredAt, message, source]
      properties:
        eventId:
          type: string
        runId:
          type: string
        sequence:
          type: integer
          format: int64
        eventType:
          type: string
          enum: [agent.run.accepted, agent.run.progress, agent.run.clarification, agent.run.plan, agent.run.finding, agent.run.completed, agent.run.failed, agent.run.cancelled]
        occurredAt:
          type: string
          format: date-time
        message:
          type: string
        source:
          type: string
          enum: [java, python]
    AgentRunEvent:
      allOf:
        - $ref: "#/components/schemas/AgentRunAuditEvent"
        - type: object
          required: [schemaVersion, conversationId]
          properties:
            schemaVersion:
