name: T02 Checkpoint smoke

on:
  workflow_dispatch:

jobs:
  checkpoint-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: timeout 180 bash scripts/smoke-checkpoint.sh
      - if: always()
        run: docker compose -f infra/docker-compose.yml --profile checkpoint logs --no-color checkpoint-db
      - if: always()
        run: docker compose -f infra/docker-compose.yml --profile checkpoint down -v
