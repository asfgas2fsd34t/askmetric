name: T03 Report smoke

on:
  workflow_dispatch:

jobs:
  report-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: timeout 120 bash scripts/smoke-report.sh
