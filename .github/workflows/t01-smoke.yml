name: T01 Agent Run smoke

on:
  workflow_dispatch:

jobs:
  contract-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: python -m pip install -r apps/agent/requirements.txt pytest
      - run: PYTHONPATH=apps/agent pytest -q apps/agent/tests
      - run: mvn -f apps/server/pom.xml test
      - run: docker compose -f infra/docker-compose.yml up --build -d
      - run: timeout 120 bash -c 'until curl --fail --silent http://localhost:8080/actuator/health; do sleep 3; done'
      - run: bash scripts/smoke-agent-run.sh
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs --no-color
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v
