name: T04 Workspace identity

on:
  workflow_dispatch:

jobs:
  workspace-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run check:api
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: mvn -q -f apps/server/pom.xml test
      - run: docker compose -f infra/docker-compose.yml up --build -d
      - run: timeout 180 bash -c 'until curl --fail --silent http://localhost:8080/actuator/health && curl --fail --silent http://localhost:5173; do sleep 3; done'
      - run: bash scripts/smoke-workspace-identity.sh
      - run: bash scripts/smoke-workspace-isolation.sh
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - if: always()
        run: docker compose -f infra/docker-compose.yml logs --no-color
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v
